<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drzewo rodzinne</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f6b4a">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3efe6;--sf:#fffdf8;--tx:#2a2a24;--mu:#6e6a5c;--ac:#3f6b4a;--onac:#fff;--bd:#d8d2c0;--dg:#a33b2b}
@media (prefers-color-scheme:dark){:root{--bg:#1a1c18;--sf:#242720;--tx:#ece9dd;--mu:#a29f90;--ac:#8fc49a;--onac:#14210f;--bd:#3a3d34;--dg:#e58a7a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
form{width:100%;max-width:360px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:22px 20px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--mu)}
.row{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--onac);border-color:var(--ac);width:100%;margin-top:12px}
button:disabled{opacity:.6}
#er{color:var(--dg);min-height:1.4em;margin:10px 0 0;font-size:15px}
.ft{margin-top:14px;font-size:13px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ft button{font-size:13px;padding:5px 9px}
label.rm{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:15px}
label.rm small{display:block;color:var(--mu);font-size:13px}
#gr{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:50%;opacity:.8}
#gr svg{width:22px;height:22px}
#mn{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:11;width:min(300px,calc(100% - 16px));background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#mn p{margin:0 0 10px;font-size:15px;color:var(--tx)}
#mn small{display:block;color:var(--mu);font-size:13px;margin-bottom:10px}
#mn button{display:block;width:100%;margin-top:8px}
#mn button.d{color:var(--dg)}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);z-index:1}
.rm{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:15px}
.rm input{margin-top:4px}
#nt{color:var(--mu);font-size:14px;margin:10px 0 0}
#gr{position:fixed;z-index:5;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:36px;height:36px;padding:0;border-radius:50%;font-size:20px;line-height:1;opacity:.6;display:flex;align-items:center;justify-content:center}
#gr:active,#gr:focus-visible{opacity:1}
#bd{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.35)}
#pn{position:fixed;z-index:7;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top,0px));max-width:340px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#pn h2{font-size:17px;margin:0 0 8px}
#pn p{font-size:14px;color:var(--mu);margin:0 0 10px}
#pn button{display:block;width:100%;margin-top:8px;text-align:left}
#pn button.d{color:var(--dg)}
#pn [hidden],#bd[hidden],#gr[hidden]{display:none}
</style>
</head>
<body data-drzewo-enc="1">
<form id="f" autocomplete="on">
<h1>Drzewo rodzinne</h1>
<p>Wpisz hasło, żeby otworzyć drzewo.</p>
<input type="text" name="username" value="drzewo" autocomplete="username" hidden>
<div class="row"><input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Hasło" required><button type="button" id="sh">Pokaż</button></div>
<label class="rm"><input type="checkbox" id="rm"><span>Zapamiętaj hasło na tym urządzeniu<small>Aplikacja będzie się otwierać bez pytania, aż do następnej aktualizacji.</small></span></label>
<button class="p" id="go" type="submit">Otwórz</button>
<div id="nt"></div>
<div id="er" role="alert"></div>
<div class="ft"><span>Wersja: 2026-11-13 08:21</span><button type="button" id="rf">Odśwież aplikację</button></div>
</form>
<button id="gr" type="button" hidden aria-label="Ustawienia aplikacji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="6.2" stroke-width="3"/><circle cx="12" cy="12" r="9.2" stroke-width="3.4" stroke-dasharray="2.9 2.86"/></svg></button>
<div id="mn" hidden>
<p id="ms"></p>
<button type="button" id="mf"></button>
<button type="button" id="mr">Odśwież aplikację</button>
<button type="button" id="mc">Zamknij</button>
<small style="margin:10px 0 0">Wersja: 2026-11-13 08:21</small>
</div>
<button id="gr" type="button" aria-label="Ustawienia" hidden>⚙</button>
<div id="bd" hidden></div>
<div id="pn" hidden role="dialog" aria-label="Ustawienia">
<h2>Ustawienia</h2>
<p id="ps"></p>
<p>Wersja: 2026-11-13 08:21</p>
<button type="button" id="pf">Zapomnij hasło</button>
<button type="button" id="pc" class="d">Wyczyść drzewo</button>
<button type="button" id="pr">Odśwież aplikację</button>
<button type="button" id="px">Zamknij</button>
</div>

async function derive(pw){
  var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC').trim()),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decWith(k){
  var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.n)},k,b64(D.c));
  return new TextDecoder().decode(p);
}
function idb(){return new Promise(function(ok,no){
  if(!window.indexedDB)return no(new Error('noidb'));
  var r=indexedDB.open('drzewo-lock',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('k')};
  r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)};
})}
function kget(){return idb().then(function(db){return new Promise(function(ok,no){
  var q=db.transaction('k').objectStore('k').get('key');
  q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){no(q.error)};
})})}
function kput(v){return idb().then(function(db){return new Promise(function(ok,no){
  var t=db.transaction('k','readwrite');t.objectStore('k').put(v,'key');
  t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)};t.onabort=function(){no(t.error)};
})})}
function kdel(){return idb().then(function(db){return new Promise(function(ok,no){
  var t=db.transaction('k','readwrite');t.objectStore('k').delete('key');
  t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)};
})})}
function openApp(html){
  var fr=document.createElement('iframe');
  fr.id='fr';fr.title='Drzewo rodzinne';fr.srcdoc=html;
  document.body.appendChild(fr);
  $('f').hidden=true;$('gr').hidden=false;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){})}
async function refreshApp(){
  try{
    var r=await navigator.serviceWorker.getRegistrations();
    for(var i=0;i<r.length;i++)await r[i].unregister();
    var k=await caches.keys();
    for(var j=0;j<k.length;j++)await caches.delete(k[j]);
  }catch(e){}
  location.reload();
}
$('sh').onclick=function(){var p=$('pw'),h=p.type==='password';p.type=h?'text':'password';this.textContent=h?'Ukryj':'Pokaż'};
$('rf').onclick=function(){this.disabled=true;refreshApp()};
$('f').onsubmit=async function(e){
  e.preventDefault();
  var er=$('er'),go=$('go');er.textContent='';
  if(!(window.crypto&&crypto.subtle)){er.textContent='Ta przeglądarka nie obsługuje szyfrowania. Otwórz aplikację z adresu https://.';return}
  go.disabled=true;go.textContent='Odszyfrowuję…';
  var key,html;
  try{key=await derive($('pw').value);html=await decWith(key)}
  catch(x){er.textContent='Nieprawidłowe hasło.';go.disabled=false;go.textContent='Otwórz';return}
  $('pw').value='';
  if($('rm').checked){
    try{await kput(key);remembered=true}catch(x){remembered=false}
  }else{try{await kdel()}catch(x){}}
  openApp(html);html=null;
};
function panelStatus(){
  $('ps').textContent=remembered?'Hasło jest zapamiętane na tym urządzeniu. Aplikacja otwiera się bez pytania.':'Hasło nie jest zapamiętane. Wpisujesz je przy każdym uruchomieniu.';
  $('pf').disabled=!remembered;
}
function panel(on){$('pn').hidden=!on;$('bd').hidden=!on;if(on)panelStatus()}
$('gr').onclick=function(){panel(true)};
$('bd').onclick=function(){panel(false)};
$('px').onclick=function(){panel(false)};
$('pr').onclick=function(){this.disabled=true;refreshApp()};
$('pf').onclick=async function(){
  if(!confirm('Zapomnieć hasło na tym urządzeniu? Przy następnym otwarciu trzeba będzie wpisać je ponownie.'))return;
  try{await kdel()}catch(e){}
  location.reload();
};
$('pc').onclick=function(){
  if(!confirm('Usunąć całe drzewo z tego urządzenia? Wszystkie osoby i dane znikną. Tego nie da się cofnąć. Jeśli nie masz kopii JSON, najpierw ją wyeksportuj.'))return;
  if(!confirm('Na pewno usunąć całe drzewo?'))return;
  var ks=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('drzewo')===0)ks.push(k)}
  ks.forEach(function(k){localStorage.removeItem(k)});
  location.reload();
};
(async function init(){
  if(!(window.crypto&&crypto.subtle))return;
  var k=null;
  try{k=await kget()}catch(e){}
  if(!k)return;
  $('go').disabled=true;$('nt').textContent='Otwieram…';
  try{openApp(await decWith(k));remembered=true;$('nt').textContent=''}
  catch(e){
    try{await kdel()}catch(x){}
    $('go').disabled=false;
    $('nt').textContent='Aplikacja została zaktualizowana, więc zapisane hasło już nie pasuje. Wpisz hasło ponownie.';
  }
})();
})();
</script>
